apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iris-ui.fullname" . }}
  labels:
    {{- include "iris-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "iris-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iris-ui.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: iris-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Server-side only. NEXT_PUBLIC_* is inlined at image build time; a value here is inert.
            - name: IRIS_SERVICE_URL
              value: {{ .Values.iris.serviceUrl | quote }}
          # GET / is renderable without iris-service, so these never depend on the upstream.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
